[project]
name = "datawalk"
version = "0.1.0a2"
description = "Walk through your data. Share it. Explore your insights. Turn plots, notebooks, dashboards, and presentations into immersive, walkable 3D worlds."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "DataWalk contributors" }]
keywords = ["data visualization", "3d", "jupyter", "notebook", "plotly", "matplotlib", "presentation", "report"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Framework :: Jupyter",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.14.1",
    "fastapi>=0.156.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
matplotlib = ["matplotlib>=3.8"]
seaborn = ["seaborn>=0.13"]
plotly = ["plotly>=6", "numpy>=1.26", "pandas>=2.2"]  # Plotly Express needs both
charts = ["matplotlib>=3.8", "seaborn>=0.13", "plotly>=6", "numpy>=1.26", "pandas>=2.2"]
pdf = ["playwright>=1.64.0"]  # PDF, video, GLB, USDZ, and missing preview images
pptx = ["python-pptx>=1.0", "playwright>=1.64.0"]  # chart images come from the viewer
notebook = ["ipykernel>=6", "nbclient>=0.10", "nbformat>=5.10"]
excel = ["openpyxl>=3.1", "xlrd>=2.0.1"]  # .xlsx and .xls
pdf-import = ["pypdfium2>=4.30"]
# The AI guide's local voice (Kokoro-82M). Not in `all`: its phonemizer (espeak-ng) is GPL-3.0,
# and the guide speaks with the browser's voice without it. docs/guide.md.
voice = ["kokoro-onnx>=0.6.1; python_version < '3.14'"]
all = [  # every optional feature
    "datawalk[charts,pdf,pptx,notebook,excel,pdf-import]",
]

[project.scripts]
datawalk = "datawalk.cli:main"

[project.urls]
Homepage = "https://github.com/datasound-projects/datawalk"
Documentation = "https://github.com/datasound-projects/datawalk/tree/main/docs"
Issues = "https://github.com/datasound-projects/datawalk/issues"
Changelog = "https://github.com/datasound-projects/datawalk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.1",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=6",
    "numpy>=1.26",
    "pandas>=2.2",
    "altair>=5",
    "openpyxl>=3.1",
    "pypdfium2>=4.30",
    "bokeh>=3.4",
]

[tool.uv.workspace]
members = ["packages/hub"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatch_build.py: a source install builds the viewer (Node.js comes from a wheel).
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["packages/python/datawalk"]
# The compiled frontend is gitignored but must ship in the wheel.
artifacts = ["packages/python/datawalk/server/static/**", "packages/python/datawalk/server/viewer/**"]

[tool.hatch.build.targets.sdist]
include = ["packages/python", "README.md", "LICENSE"]
artifacts = ["packages/python/datawalk/server/static/**", "packages/python/datawalk/server/viewer/**"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/hub/tests"]
faulthandler_timeout = 300  # a test that hangs prints the stack of every thread

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/notebook/*.ipynb"]  # generated example: its outputs are the test data

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/notebook/make_notebook.py" = ["E501"]  # notebook cell sources as strings
"packages/hub/**" = ["E501"]  # SQL statements read best on one line
"examples/thematic_sectors/*.ipynb" = ["E501"]  # facts and sources as text

[tool.ruff.lint.isort]
known-first-party = ["datawalk"]
