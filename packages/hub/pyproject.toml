[project]
name = "datawalk-hub"
version = "0.1.0a2"
description = "DataWalk Hub: share walkable 3D reports. Self-hosted: SSO, permissions, versions, comments, audit log, live follow."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "datawalk==0.1.0a2",  # exact: "datawalk" on PyPI is another project
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "signxml>=4",
    "lxml>=5",
]

[project.scripts]
datawalk-hub = "datawalk_hub.cli:main"

[tool.uv.sources]
datawalk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datawalk_hub"]
